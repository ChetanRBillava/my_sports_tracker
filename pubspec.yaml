name: my_sports_tracker
description: "A new Flutter project for sports tracking."

publish_to: 'none'
version: 2.0.1+7

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  ui_utility_package:
    path: ../packages/ui_utility_package
  flutter_bloc:
  equatable:
  shared_preferences:
  cupertino_icons: ^1.0.8
  intl:
  screenshot:
  path_provider:
  share_plus:
  file_picker:
  dio:
  json_serializable:
  build_runner:
  firebase_core:
  firebase_analytics:
  firebase_crashlytics:
  firebase_remote_config:
  firebase_messaging:
  flutter_local_notifications:
  lottie:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/
    - assets/lottie/

  uses-material-design: true